<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PABE OS</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PABE">

<link rel="stylesheet" href="css/calendario.css">
</head>
<body>
<div id="app">
 <nav id="rail" aria-label="Módulos">
  <div class="logo">PABE</div>
  <a class="mod" data-m="notas" href="#notas" title="Notas" aria-label="Notas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></a>
  <a class="mod" data-m="calendario" href="#calendario" title="Calendario" aria-label="Calendario"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></a>
  <a class="mod" data-m="finanzas" href="#finanzas" title="Finanzas" aria-label="Finanzas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5a4.5 4.5 0 1 0 0 7M7 11h6M7 13.5h6"/></svg></a>
  <a class="mod off" data-m="viajes" href="#viajes" title="Viajes · próximamente" aria-label="Viajes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10.5 13.5 3 11l1.5-1.5 8 1L17 6c1-1 2.5-1.5 3-1s0 2-1 3l-4.5 4.5 1 8L14 22l-2.5-7.5L8 18v2.5L6.5 22 5 19l-3-1.5L3.5 16H6z"/></svg></a>
 </nav>
 <main>
  <section class="view" data-view="notas"></section>
  <section class="view" data-view="finanzas" hidden></section>
  <section class="view" data-view="calendario" hidden></section>
  <section class="view soon" data-view="soon" hidden><div id="soonBody"></div></section>
  <button id="drv" class="drv">…</button>
  <a id="plus" class="plus" href="#notas/nueva" title="Nota nueva" aria-label="Nota nueva"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
  <button id="reload" class="reload" title="Actualizar la página" aria-label="Actualizar la página"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
 </main>
</div>
<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
